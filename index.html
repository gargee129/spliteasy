<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SplitEasy</title>
<style>
/* ===== Design tokens ===== */
:root{
  --bg:#fafafa; --card:#fff; --text:#1a1a1a; --muted:#666;
  --accent:#2e7d32; --accent-hover:#1b5e20; --accent-light:#e8f5e9;
  --danger:#c62828; --danger-light:#fdeaea;
  --border:#e0e0e0; --radius:14px; --shadow:0 2px 8px rgba(0,0,0,.06);
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121212; --card:#1e1e1e; --text:#e0e0e0; --muted:#9e9e9e;
    --accent:#66bb6a; --accent-hover:#81c784; --accent-light:#1b5e20;
    --danger:#ef5350; --danger-light:#b71c1c;
    --border:#333; --shadow:0 2px 8px rgba(0,0,0,.4);
  }
}

/* ===== Base ===== */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;padding:16px}
h1{font-size:1.6rem;font-weight:700;text-align:center;margin-bottom:8px;color:var(--accent)}
.subtitle{text-align:center;color:var(--muted);margin-bottom:24px;font-size:.95rem}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.card h2{font-size:1.1rem;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* ===== Form elements ===== */
label{display:block;font-size:.9rem;margin-bottom:4px;color:var(--muted)}
input[type=text],input[type=number],select{
  width:100%;padding:14px 12px;border:1px solid var(--border);border-radius:10px;
  background:var(--bg);color:var(--text);font-size:1rem;min-height:44px
}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.row{display:flex;gap:12px;margin-bottom:12px}
.row > *{flex:1}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 16px;border:none;border-radius:10px;font-size:1rem;font-weight:600;
  cursor:pointer;min-height:44px;transition:background .15s,transform .05s
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff;width:100%}
.btn-primary:hover{background:var(--accent-hover)}
.btn-danger{background:var(--danger-light);color:var(--danger)}
.btn-danger:hover{background:#fce4e4}
.btn-ghost{background:transparent;color:var(--accent)}
.btn-ghost:hover{background:var(--accent-light)}

/* ===== People list ===== */
.person-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.person-row:last-child{border-bottom:none}
.person-name{font-weight:500}
.person-actions{display:flex;gap:8px}

/* ===== Expense form ===== */
.split-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.split-label{
  display:flex;align-items:center;gap:6px;padding:8px 12px;
  background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:.9rem;cursor:pointer
}
.split-label input{accent-color:var(--accent);width:18px;height:18px}

/* ===== Expense list ===== */
.expense-row{
  display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)
}
.expense-row:last-child{border-bottom:none}
.expense-main{min-width:0}
.expense-desc{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.expense-meta{font-size:.85rem;color:var(--muted);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.expense-amount{font-weight:600;color:var(--accent);white-space:nowrap}
.expense-empty{text-align:center;color:var(--muted);padding:24px 0}

/* ===== Balances ===== */
.balance-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.balance-row:last-child{border-bottom:none}
.balance-name{font-weight:500}
.balance-amount{font-weight:600;font-variant-numeric:tabular-nums}
.balance-amount.positive{color:var(--accent)}
.balance-amount.negative{color:var(--danger)}
.balance-empty{text-align:center;color:var(--muted);padding:24px 0}

/* ===== Settle up ===== */
.settle-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);align-items:center}
.settle-row:last-child{border-bottom:none}
.settle-text{font-size:.95rem}
.settle-arrow{color:var(--muted);margin:0 8px}
.settle-from{font-weight:500}
.settle-to{font-weight:500;color:var(--accent)}
.settle-amount{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.settle-empty{text-align:center;color:var(--muted);padding:24px 0}

/* ===== Helpers ===== */
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>

<h1>SplitEasy</h1>
<p class="subtitle">Split expenses with flatmates — fair &amp; simple</p>

<!-- PEOPLE -->
<section class="card" id="peopleCard">
  <h2>Flatmates</h2>
  <div class="row">
    <input type="text" id="personName" placeholder="Name" maxlength="30" aria-label="Flatmate name">
    <button class="btn btn-primary" id="addPersonBtn" aria-label="Add flatmate">Add</button>
  </div>
  <div id="peopleList" role="list" aria-label="Current flatmates"></div>
  <p id="peopleEmpty" class="hidden" style="margin-top:8px;text-align:center;color:var(--muted)">No flatmates yet. Add one above.</p>
</section>

<!-- ADD EXPENSE -->
<section class="card" id="expenseCard">
  <h2>Add Expense</h2>
  <form id="expenseForm" novalidate>
    <label for="expenseDesc">Description</label>
    <input type="text" id="expenseDesc" placeholder="e.g. Groceries, WiFi bill" required maxlength="50">

    <div class="row" style="margin-top:12px">
      <div>
        <label for="expenseAmount">Amount (₹)</label>
        <input type="number" id="expenseAmount" placeholder="0.00" step="0.01" min="0.01" required inputmode="decimal">
      </div>
      <div>
        <label for="expensePaidBy">Paid by</label>
        <select id="expensePaidBy" required><option value="">Select…</option></select>
      </div>
    </div>

    <label for="splitBetween">Split between <span class="split-hint" style="font-weight:400;color:var(--muted)"></span></label>
    <div class="split-group" id="splitBetween" role="group" aria-label="Split between"></div>

    <button type="submit" class="btn btn-primary" style="margin-top:16px" id="submitExpenseBtn">Add Expense</button>
  </form>
</section>

<!-- EXPENSE LIST -->
<section class="card" id="expenseListCard">
  <h2>Expenses</h2>
  <div id="expenseList" role="list" aria-label="All expenses"></div>
  <p id="expenseEmpty" class="expense-empty hidden">No expenses yet. Add your first one above.</p>
</section>

<!-- BALANCES -->
<section class="card" id="balanceCard">
  <h2>Balances</h2>
  <div id="balanceList" role="list" aria-label="Who owes what"></div>
  <p id="balanceEmpty" class="balance-empty hidden">Add expenses to see balances.</p>
</section>

<!-- SETTLE UP -->
<section class="card" id="settleCard">
  <h2>Settle Up</h2>
  <div id="settleList" role="list" aria-label="Minimum payments needed"></div>
  <p id="settleEmpty" class="settle-empty hidden">All settled! 🎉</p>
</section>

<script>
/* ===== State & Persistence ===== */
const STORAGE_KEY = 'spliteasy_data';
let state = { people: [], expenses: [] };

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = JSON.parse(raw); }
  }catch(e){ console.error('Load failed', e); }
  // ensure IDs are numbers
  state.people.forEach(p=>p.id=Number(p.id));
  state.expenses.forEach(e=>{
    e.id=Number(e.id); e.amount=Number(e.amount);
    e.paidBy=Number(e.paidBy); e.splitBetween=e.splitBetween.map(Number);
  });
}
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* ===== Helpers ===== */
const $ = (sel, root=document)=>root.querySelector(sel);
const $$ = (sel, root=document)=>[...root.querySelectorAll(sel)];
function uid(){ return Date.now() + Math.random(); } // simple unique id
function fmt(n){ return '₹' + Number(n).toFixed(2); }
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ===== Calculations ===== */
// returns {personId: net}  positive = is owed, negative = owes
function calcBalances(){
  const net = {};
  state.people.forEach(p=>net[p.id]=0);
  state.expenses.forEach(e=>{
    const share = e.amount / e.splitBetween.length;
    e.splitBetween.forEach(id=> net[id] -= share);
    net[e.paidBy] += e.amount;
  });
  // round to 2 decimals to avoid floating errors
  Object.keys(net).forEach(k=> net[k] = Math.round(net[k]*100)/100 );
  return net;
}

// greedy settlement: returns [{from, to, amount}]
function calcSettlements(){
  const net = calcBalances();
  const creditors = [], debtors = [];
  Object.entries(net).forEach(([id, val])=>{
    if(val > 0.005) creditors.push({id:Number(id), amount:val});
    else if(val < -0.005) debtors.push({id:Number(id), amount:-val});
  });
  creditors.sort((a,b)=>b.amount-a.amount);
  debtors.sort((a,b)=>b.amount-a.amount);

  const settlements = [];
  let i=0, j=0;
  while(i<creditors.length && j<debtors.length){
    const cr = creditors[i], dr = debtors[j];
    const amt = Math.min(cr.amount, dr.amount);
    settlements.push({from:dr.id, to:cr.id, amount:Math.round(amt*100)/100});
    cr.amount -= amt; dr.amount -= amt;
    if(cr.amount < 0.005) i++;
    if(dr.amount < 0.005) j++;
  }
  return settlements;
}

/* ===== Render ===== */
function render(){
  renderPeople();
  renderExpenseForm();
  renderExpenses();
  renderBalances();
  renderSettle();
}

function renderPeople(){
  const list = $('#peopleList'), empty = $('#peopleEmpty');
  list.innerHTML = '';
  if(state.people.length===0){
    empty.classList.remove('hidden'); return;
  }
  empty.classList.add('hidden');
  state.people.forEach(p=>{
    const div = document.createElement('div');
    div.className = 'person-row';
    div.innerHTML = `
      <span class="person-name">${escapeHtml(p.name)}</span>
      <div class="person-actions">
        <button class="btn btn-danger btn-sm" data-del="${p.id}" aria-label="Remove ${escapeHtml(p.name)}">Remove</button>
      </div>`;
    list.appendChild(div);
  });
  // bind delete
  $$('[data-del]', list).forEach(btn=>{
    btn.addEventListener('click',()=>{ deletePerson(Number(btn.dataset.del)); });
  });
}

function renderExpenseForm(){
  // paidBy select
  const paidBy = $('#expensePaidBy');
  paidBy.innerHTML = '<option value="">Select…</option>';
  state.people.forEach(p=>{
    const opt = document.createElement('option');
    opt.value = p.id; opt.textContent = p.name;
    paidBy.appendChild(opt);
  });

  // splitBetween checkboxes
  const group = $('#splitBetween'), hint = $('.split-hint');
  group.innerHTML = '';
  if(state.people.length===0){
    hint.textContent = '(add flatmates first)';
    $('#submitExpenseBtn').disabled = true;
    return;
  }
  hint.textContent = '';
  $('#submitExpenseBtn').disabled = false;
  state.people.forEach(p=>{
    const label = document.createElement('label');
    label.className = 'split-label';
    label.innerHTML = `<input type="checkbox" value="${p.id}" checked> ${escapeHtml(p.name)}`;
    group.appendChild(label);
  });
}

function renderExpenses(){
  const list = $('#expenseList'), empty = $('#expenseEmpty');
  list.innerHTML = '';
  if(state.expenses.length===0){
    empty.classList.remove('hidden'); return;
  }
  empty.classList.add('hidden');
  // newest first
  [...state.expenses].reverse().forEach(e=>{
    const paid = state.people.find(p=>p.id===e.paidBy);
    const splitNames = e.splitBetween.map(id=>state.people.find(p=>p.id===id)?.name).filter(Boolean);
    const div = document.createElement('div');
    div.className = 'expense-row';
    div.setAttribute('role','listitem');
    div.innerHTML = `
      <div class="expense-main">
        <div class="expense-desc">${escapeHtml(e.description)}</div>
        <div class="expense-meta">
          <span>Paid by: <strong>${escapeHtml(paid?.name||'?')}</strong></span>
          <span>Split: ${splitNames.map(escapeHtml).join(', ')}</span>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <span class="expense-amount">${fmt(e.amount)}</span>
        <button class="btn btn-danger btn-sm" data-del="${e.id}" aria-label="Delete expense" style="padding:6px 10px;font-size:.85rem">Delete</button>
      </div>`;
    list.appendChild(div);
  });
  $$('[data-del]', list).forEach(btn=>{
    btn.addEventListener('click',()=>{ deleteExpense(Number(btn.dataset.del)); });
  });
}

function renderBalances(){
  const list = $('#balanceList'), empty = $('#balanceEmpty');
  list.innerHTML = '';
  const net = calcBalances();
  const hasNonZero = Object.values(net).some(v=>Math.abs(v)>0.005);
  if(!hasNonZero || state.people.length===0){
    empty.classList.remove('hidden'); return;
  }
  empty.classList.add('hidden');
  state.people.forEach(p=>{
    const val = net[p.id] || 0;
    const div = document.createElement('div');
    div.className = 'balance-row';
    div.setAttribute('role','listitem');
    div.innerHTML = `
      <span class="balance-name">${escapeHtml(p.name)}</span>
      <span class="balance-amount ${val>0?'positive':val<0?'negative':''}">${val>=0?'+':''}${fmt(val)}</span>`;
    list.appendChild(div);
  });
}

function renderSettle(){
  const list = $('#settleList'), empty = $('#settleEmpty');
  list.innerHTML = '';
  const settlements = calcSettlements();
  if(settlements.length===0){
    empty.classList.remove('hidden'); return;
  }
  empty.classList.add('hidden');
  settlements.forEach(s=>{
    const from = state.people.find(p=>p.id===s.from);
    const to = state.people.find(p=>p.id===s.to);
    if(!from||!to) return;
    const div = document.createElement('div');
    div.className = 'settle-row';
    div.setAttribute('role','listitem');
    div.innerHTML = `
      <span class="settle-text">
        <span class="settle-from">${escapeHtml(from.name)}</span>
        <span class="settle-arrow">→</span>
        <span class="settle-to">${escapeHtml(to.name)}</span>
      </span>
      <span class="settle-amount">${fmt(s.amount)}</span>`;
    list.appendChild(div);
  });
}

/* ===== Actions ===== */
function addPerson(){
  const input = $('#personName');
  const name = input.value.trim();
  if(!name){ alert('Name cannot be empty'); return; }
  if(state.people.some(p=>p.name.toLowerCase()===name.toLowerCase())){
    alert('That name already exists'); return;
  }
  state.people.push({id:uid(), name});
  input.value=''; save(); render();
}
function deletePerson(id){
  if(state.expenses.some(e=>e.paidBy===id || e.splitBetween.includes(id))){
    alert('Cannot remove — person has expenses. Delete those expenses first.'); return;
  }
  state.people = state.people.filter(p=>p.id!==id);
  save(); render();
}
function addExpense(e){
  e.preventDefault();
  const desc = $('#expenseDesc').value.trim();
  const amount = parseFloat($('#expenseAmount').value);
  const paidBy = Number($('#expensePaidBy').value);
  const splitBetween = $$('#splitBetween input:checked').map(cb=>Number(cb.value));

  if(!desc){ alert('Description required'); return; }
  if(!amount || amount<=0){ alert('Enter a valid amount'); return; }
  if(!paidBy){ alert('Select who paid'); return; }
  if(splitBetween.length===0){ alert('Select at least one person to split with'); return; }
  if(!splitBetween.includes(paidBy)){
    // auto-add payer to split
    splitBetween.push(paidBy);
  }

  state.expenses.push({
    id:uid(),
    description: desc,
    amount: Math.round(amount*100)/100,
    paidBy,
    splitBetween
  });
  e.target.reset();
  // re-check all checkboxes
  $$('#splitBetween input').forEach(cb=>cb.checked=true);
  save(); render();
}
function deleteExpense(id){
  state.expenses = state.expenses.filter(e=>e.id!==id);
  save(); render();
}

/* ===== Init ===== */
load();
render();

// event listeners
$('#addPersonBtn').addEventListener('click', addPerson);
$('#personName').addEventListener('keydown', e=>{ if(e.key==='Enter') addPerson(); });
$('#expenseForm').addEventListener('submit', addExpense);
</script>
</body>
</html>
